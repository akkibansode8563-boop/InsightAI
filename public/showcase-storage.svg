<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  
  <circle cx="250" cy="180" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="550" cy="270" r="180" fill="#db2777" opacity="0.1" filter="url(#glow)" />
  
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" rx="12" />
  
  <g transform="translate(400, 190)" text-anchor="middle">
    <!-- Component/Storage Chip Outline -->
    <path d="M -40,-40 L 40,-40 A 8,8 0 0 1 48,-32 L 48,32 A 8,8 0 0 1 40,40 L -40,40 A 8,8 0 0 1 -48,32 L -48,-32 A 8,8 0 0 1 -40,-40 Z" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Connector pins -->
    <!-- Top Pins -->
    <line x1="-30" y1="-40" x2="-30" y2="-48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="-15" y1="-40" x2="-15" y2="-48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="0" y1="-40" x2="0" y2="-48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="15" y1="-40" x2="15" y2="-48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="30" y1="-40" x2="30" y2="-48" stroke="url(#accent-grad)" stroke-width="3" />
    <!-- Bottom Pins -->
    <line x1="-30" y1="40" x2="-30" y2="48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="-15" y1="40" x2="-15" y2="48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="0" y1="40" x2="0" y2="48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="15" y1="40" x2="15" y2="48" stroke="url(#accent-grad)" stroke-width="3" />
    <line x1="30" y1="40" x2="30" y2="48" stroke="url(#accent-grad)" stroke-width="3" />
    <!-- Inner design -->
    <rect x="-24" y="-24" width="48" height="48" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" rx="4" />
    
    <!-- Text Elements -->
    <text y="105" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">COMPONENT BRIEF SHOWCASE</text>
    <text y="130" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="1">ENTERPRISE IT HARDWARE INTELLIGENCE</text>
  </g>
</svg>
