<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  
  <circle cx="250" cy="180" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="550" cy="270" r="180" fill="#0ea5e9" opacity="0.1" filter="url(#glow)" />
  
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" rx="12" />
  
  <g transform="translate(400, 190)" text-anchor="middle">
    <!-- Router/Networking Outline -->
    <!-- Antennas -->
    <line x1="-50" y1="-20" x2="-70" y2="-50" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
    <line x1="50" y1="-20" x2="70" y2="-50" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
    <line x1="0" y1="-20" x2="0" y2="-55" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
    <!-- Router base -->
    <path d="M -76,-10 L 76,-10 A 10,10 0 0 1 86,0 L 86,22 A 10,10 0 0 1 76,32 L -76,32 A 10,10 0 0 1 -86,22 L -86,0 A 10,10 0 0 1 -76,-10 Z" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Indicator LEDs -->
    <circle cx="-50" cy="11" r="4.5" fill="#f8fafc" opacity="0.8" />
    <circle cx="-30" cy="11" r="4.5" fill="#f8fafc" opacity="0.8" />
    <circle cx="-10" cy="11" r="4.5" fill="#f8fafc" opacity="0.8" />
    <circle cx="10" cy="11" r="4.5" fill="#f8fafc" opacity="0.8" />
    
    <!-- Text Elements -->
    <text y="105" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">NETWORKING BRIEF SHOWCASE</text>
    <text y="130" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="1">ENTERPRISE IT HARDWARE INTELLIGENCE</text>
  </g>
</svg>
