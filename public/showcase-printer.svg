<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  
  <circle cx="250" cy="180" r="160" fill="#f97316" opacity="0.15" filter="url(#glow)" />
  <circle cx="550" cy="270" r="180" fill="#ec4899" opacity="0.1" filter="url(#glow)" />
  
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" rx="12" />
  
  <g transform="translate(400, 190)" text-anchor="middle">
    <!-- Printer Outline -->
    <!-- Top Tray -->
    <path d="M -36,-25 L -36,-45 L 36,-45 L 36,-25" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Main Body -->
    <path d="M -56,-25 L 56,-25 A 8,8 0 0 1 64,-17 L 64,21 A 8,8 0 0 1 56,29 L -56,29 A 8,8 0 0 1 -64,21 L -64,-17 A 8,8 0 0 1 -56,-25 Z" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Output Tray -->
    <path d="M -40,29 L -40,41 L 40,41 L 40,29" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Text Elements -->
    <text y="105" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">PRINTER BRIEF SHOWCASE</text>
    <text y="130" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="1">ENTERPRISE IT HARDWARE INTELLIGENCE</text>
  </g>
</svg>
