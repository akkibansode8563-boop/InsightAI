<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  
  <!-- Aurora Mesh Background Lights -->
  <circle cx="250" cy="180" r="160" fill="#4f46e5" opacity="0.15" filter="url(#glow)" />
  <circle cx="550" cy="270" r="180" fill="#c084fc" opacity="0.1" filter="url(#glow)" />
  
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" rx="12" />
  
  <!-- Showcase Graphic -->
  <g transform="translate(400, 190)" text-anchor="middle">
    <!-- Neon Laptop Outline -->
    <path d="M -90,30 L -90,-50 A 10,10 0 0 1 -80,-60 L 80,-60 A 10,10 0 0 1 90,-50 L 90,30 Z" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M -110,30 L 110,30 A 8,8 0 0 1 118,38 L 118,42 A 2,2 0 0 1 116,44 L -116,44 A 2,2 0 0 1 -118,42 L -118,38 A 8,8 0 0 1 -110,30 Z" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
    <line x1="-30" y1="36" x2="30" y2="36" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Text Elements -->
    <text y="105" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">LAPTOP BRIEF SHOWCASE</text>
    <text y="130" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="1">ENTERPRISE IT HARDWARE INTELLIGENCE</text>
  </g>
</svg>
